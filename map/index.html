<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Карта — прототип</title>
<link rel="stylesheet" href="../shared/generator/generator.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:#d8c08c;overflow:hidden;overscroll-behavior:none;
    font:400 15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff}
  button{font:inherit;cursor:pointer}

  /* ─── карта ─── */
  #viewport{position:fixed;inset:0;overflow:hidden;touch-action:none}
  #canvas{position:absolute;left:0;top:0;width:922px;height:1200px;transform-origin:0 0}
  #canvas img.base{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .plot{position:absolute;transform:translate(-50%,-50%);width:150px;height:150px}
  .pad{position:absolute;left:50%;top:50%;width:140px;height:78px;
    transform:translate(-50%,-50%) rotate(45deg) scaleY(.58);border-radius:6px;transition:.15s}
  .art{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none}
  .art img{display:block;width:150px;height:auto}

  /* свободная плитка видна только в режиме размещения */
  .plot[data-state="free"] .pad{opacity:0}
  body.placing .plot[data-state="free"] .pad{
    opacity:1;background:rgba(90,230,120,.45);border:2px solid rgba(140,255,170,.9);cursor:pointer}
  body.placing .plot[data-state="free"].pick .pad{background:rgba(120,255,150,.75)}



  .chip{position:absolute;left:50%;top:0;transform:translate(-50%,-120%);
    background:#fff;color:#000;border-radius:100px;padding:6px 12px;font:600 13px/1 inherit;white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .chip.unlock{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
    font-size:26px;padding:0;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,-120%)}50%{transform:translate(-50%,-145%)}}

  .label{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
    background:rgba(0,0,0,.6);border-radius:100px;padding:5px 10px;
    font:600 12px/1 inherit;white-space:nowrap}

  /* ─── шапка ─── */
  #bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;
    padding:14px 16px;background:linear-gradient(#000a,#0000);pointer-events:none}
  #bar .money{pointer-events:auto;display:flex;gap:8px}
  .pill{background:rgba(0,0,0,.55);border:0;color:#fff;border-radius:100px;padding:8px 13px;
    font:600 13px/1 inherit;display:flex;align-items:center;gap:6px}
  .pill i{width:15px;height:15px;border-radius:50%;display:block}
  .i-gem{background:radial-gradient(circle at 34% 28%,#7ee0ff,#1a6ee8 72%)}
  .i-coin{background:radial-gradient(circle at 34% 28%,#ffe066,#f0940a 72%)}
  #bar .grow{flex:1}
  #reset{pointer-events:auto}

  /* ─── нижняя кнопка ─── */
  #dock{position:fixed;left:16px;right:16px;bottom:24px;z-index:20;display:flex;gap:10px}
  .primary{flex:1;background:#ffd60a;color:#000;border:0;border-radius:14px;padding:16px;
    font:600 16px/1 inherit;display:flex;align-items:center;justify-content:center;gap:8px}
  .square{width:56px;background:#ffd60a;color:#000;border:0;border-radius:14px;font-size:20px}

  /* ─── каталог построек ─── */
  #sheet{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
  #sheet.on{display:flex}
  #sheet header{display:flex;align-items:center;gap:10px;padding:16px}
  #sheet header h2{margin:0;font-size:28px;font-weight:700;flex:1}
  .close{border:0;background:none;color:#0a84ff;font-size:26px;line-height:1;padding:6px}
  .cats{overflow-y:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
  .cat{background:rgba(255,255,255,.08);border-radius:16px;padding:16px;position:relative}
  .cat b{display:block;text-align:center;font-size:17px;margin-bottom:10px}
  .cat .dot{position:absolute;right:14px;top:14px;width:8px;height:8px;border-radius:50%;background:#ff453a}
  .cat .row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
  .cat .row::-webkit-scrollbar{display:none}
  .card{flex:0 0 168px;background:rgba(255,255,255,.06);border-radius:14px;padding:12px;text-align:center}
  .card img{width:100%;height:110px;object-fit:contain;display:block}
  .card b{display:block;font-size:15px;margin:8px 0}
  .card .buy{width:100%;background:#ffd60a;color:#000;border:0;border-radius:10px;padding:11px;font:600 14px/1 inherit}
  .card.locked{opacity:.45}

  /* ─── конфетти ─── */
  #confetti{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden;display:none}
  #confetti.on{display:block}
  #confetti span{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.5s ease-out forwards}
  @keyframes fall{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    100%{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}
  }

  /* ─── экран здания ─── */
  #screen{position:fixed;inset:0;z-index:50;background:#000;display:none}
  #screen.on{display:block}
  #screen .back{position:fixed;left:8px;top:44px;z-index:60;border:0;background:none;
    color:#0a84ff;font:300 26px/24px inherit;padding:8px}


  /* ─── подсказки внутри генератора ─── */
  #genSpeech{position:fixed;left:16px;right:16px;z-index:70;display:none;align-items:flex-start;gap:12px;
    pointer-events:none}
  #genSpeech.on{display:flex}
  #genSpeech img{flex:0 0 auto;width:66px;height:66px;object-fit:contain}
  #genSpeech .b{background:#3a3a3c;border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.3;
    font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.5)}

  #genDemo{position:fixed;inset:0;z-index:69;pointer-events:none;display:none}
  #genDemo.on{display:block}
  #genDemo path{stroke:#ffd60a;stroke-width:5;stroke-dasharray:12 10;stroke-linecap:round;fill:none}
  #genDemo polygon{fill:#ffd60a}
  #genDemo .runner{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;
    offset-rotate:0deg;animation:ride 3.2s cubic-bezier(.5,0,.5,1) infinite}
  #genDemo .runner img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
  @keyframes ride{
    0%{offset-distance:0%;opacity:0;transform:scale(.75)}
    8%{opacity:1;transform:scale(1)}
    88%{offset-distance:100%;opacity:1;transform:scale(1)}
    100%{offset-distance:100%;opacity:0;transform:scale(.75)}}

  #boostTip{position:fixed;z-index:71;display:none;transform:translate(-50%,0)}
  #boostTip.on{display:block}
  #boostTip .box{background:#428bf9;border-radius:16px;padding:12px 14px;min-width:150px;text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.5);position:relative}
  #boostTip .box b{display:block;font-size:16px;font-weight:700;margin-bottom:8px}
  #boostTip .time{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
    border-radius:100px;padding:5px 10px;font-size:13px;font-weight:500}
  #boostTip .boost{display:block;width:100%;margin-top:8px;background:#ffd60a;color:#000;border:0;
    border-radius:100px;padding:9px 12px;font:600 14px/1 inherit}
  #boostTip .nose{position:absolute;left:50%;top:-7px;transform:translateX(-50%) rotate(45deg);
    width:14px;height:14px;background:#428bf9;border-radius:3px}

  #level{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column;
    align-items:center;padding:64px 20px 34px}
  #level.on{display:flex}
  #level .num{width:96px;height:96px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center;
    font-size:40px;font-weight:700;margin-top:70px}
  #level h2{margin:24px 0 0;font-size:30px;font-weight:700}
  #level .reward{margin-top:10px;color:#8e8e93;font-size:15px;display:flex;align-items:center;gap:8px}
  #level .reward b{background:rgba(255,255,255,.12);border-radius:100px;padding:6px 12px;color:#fff;font-size:14px}
  #level .got{margin-top:44px;color:#8e8e93;font-size:14px}
  #level .items{display:flex;gap:12px;margin-top:12px}
  #level .items div{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.1);
    display:grid;place-items:center;font-size:30px}
  #level .take{margin-top:auto;width:100%;background:#ffd60a;color:#000;border:0;border-radius:14px;
    padding:17px;font:600 16px/1 inherit}

  /* ═══ сюжетный слой онбординга ═══ */
  #story{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;padding:0 12px 22px}
  #story.on{display:block}
  #story .who{position:relative;display:flex;align-items:flex-end;gap:0;margin-left:4px}
  #story .who img{height:150px;width:auto;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  #story .who .name{position:absolute;left:14px;bottom:-8px;border-radius:8px;padding:4px 10px;
    font:700 13px/1 inherit;color:#fff}
  #story .who .name.grandson{background:#d5341f}
  #story .who .name.granny{background:#7b5cff}
  #story .bubble{margin-top:14px;background:#1c1c1e;border-radius:18px;padding:16px 18px 20px;
    font-size:16px;line-height:1.35;font-weight:500;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #story .bubble .next{position:absolute;right:14px;bottom:8px;color:#ffd60a;font-size:12px}

  /* стрелка-указатель на элемент интерфейса */
  #point{position:fixed;z-index:62;display:none;font-size:44px;color:#ffd60a;pointer-events:none;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  #point.on{display:block;animation:pnudge .9s ease-in-out infinite}
  @keyframes pnudge{0%,100%{transform:translate(0,0)}50%{transform:translate(0,10px)}}

  /* зёрна улетают за экран после ускорения */
  .flyaway{position:fixed;z-index:75;width:44px;height:44px;pointer-events:none;
    animation:flyoff .7s cubic-bezier(.4,0,.7,1) forwards}
  @keyframes flyoff{to{transform:translate(60vw,-70vh) scale(.35);opacity:0}}

  #hintline{position:fixed;left:16px;right:16px;bottom:96px;z-index:20;text-align:center;
    font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none}
</style>
</head>
<body>

<div id="viewport"><div id="canvas"><img class="base" src="../assets/map/map-base.png" alt=""></div></div>

<div id="bar">
  <div class="money">
    <span class="pill"><i class="i-gem"></i>500</span>
    <span class="pill"><i class="i-coin"></i><b id="coins">5 000</b></span>
  </div>
  <span class="grow"></span>
  <button class="pill" id="reset">сброс</button>
</div>

<div id="hintline"></div>

<div id="dock">
  <button class="primary" id="openSheet">🔨 Постройки</button>
</div>

<div id="sheet">
  <header><h2>Постройки</h2><button class="close">✕</button></header>
  <div class="cats" id="cats"></div>
</div>

<div id="confetti"></div>

<div id="story">
  <div class="who"><img alt=""><span class="name"></span></div>
  <div class="bubble"><span class="text"></span><span class="next">▼</span></div>
</div>
<div id="point">⬇</div>

<div id="screen">
  <button class="back" aria-label="Назад">‹</button>
  <div id="app"></div>

  <div id="genSpeech"><img alt=""><div class="b"></div></div>
  <div id="genDemo"></div>

  <div id="boostTip">
    <div class="box">
      <span class="nose"></span>
      <b>Кофе</b>
      <span class="time">🕐 ещё 29 сек</span>
      <button class="boost">🪙 Бесплатно</button>
    </div>
  </div>

  <div id="level">
    <div class="num">2</div>
    <h2>Новый уровень</h2>
    <div class="reward">Заберите награду: <b>🪙 93</b></div>
    <div class="got">Теперь вам доступны</div>
    <div class="items"><div>🌾</div><div>🍌</div></div>
    <button class="take">Забрать награду</button>
  </div>
</div>

<script src="../shared/generator/generator.js"></script>
<script>
'use strict';

/* ═══════════ ДАННЫЕ ═══════════ */

const BUILD_MS = 3000;                 // стройка идёт 3 секунды

const CATALOG = [
  { cat:'Преобразователи', items:[
      { id:'gen', name:'Генератор', price:0, opens:'generator', art:'', hidden:true },
      { id:'coffee', name:'Кофейня', price:2000, opens:'generator',
        art:'../assets/map/Cafe.png',
        artBuild:'../assets/map/Cafe-construction.png',
        artGift:'../assets/map/cafe-constructionend-open.png' },
      { id:'plant',  name:'Завод',   price:3500, art:'../assets/map/building-generator.png', opens:'generator' },
      { id:'orders', name:'Доска заказов', price:1500, art:'../assets/map/building-order board.png' },
  ]},
  { cat:'Дома', items:[
      { id:'house', name:'Домик', price:1200, art:'../assets/map/building-barn.png', locked:true },
  ]},
  { cat:'Декор', items:[
      { id:'tree', name:'Дерево', price:300, art:'../assets/map/building-barn.png', locked:true },
  ]},
];
const itemById = id => CATALOG.flatMap(c => c.items).find(i => i.id === id);

/* свободные плитки: куда вообще можно ставить */
const PLOTS = [
  { id:'p0', x:285, y:880 },      // генератор, стоит на карте изначально
  { id:'p1', x:150, y:520 },
  { id:'p2', x:612, y:840 },
  { id:'p3', x:735, y:1075 },
  { id:'p4', x:430, y:1010 },
];

const KEY = 'farm-map-v2';
let coins = 5000;
let built = {};        // plotId → { itemId, state:'building'|'gift'|'ready', endsAt, flip }

function save(){ localStorage.setItem(KEY, JSON.stringify({coins, built})); }
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && typeof r === 'object'){ coins = r.coins ?? 5000; built = r.built || {}; }
  }catch{}
  // генератор нарисован на самой карте — площадка нужна только чтобы по нему тапали
  built.p0 = { itemId:'gen', state:'ready' };
}
load();

/* ═══════════ ОТРИСОВКА КАРТЫ ═══════════ */

const canvas = document.getElementById('canvas');
const hintline = document.getElementById('hintline');
const coinsEl = document.getElementById('coins');
const plotEls = {};

function buildPlots(){
  PLOTS.forEach(p => {
    const el = document.createElement('div');
    el.className = 'plot';
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.dataset.id = p.id;
    el.innerHTML = '<div class="pad"></div><div class="art"></div>';
    canvas.appendChild(el);
    plotEls[p.id] = el;
  });
  paintAll();
}

function paintPlot(p){
  const el = plotEls[p.id];
  const b = built[p.id];
  el.querySelectorAll('.chip,.label,.scaffold,.gift').forEach(n => n.remove());
  const art = el.querySelector('.art');

  if(!b){ el.dataset.state = 'free'; art.innerHTML = ''; return; }

  const item = itemById(b.itemId);
  el.dataset.state = b.state;

  const src = b.state === 'building' ? (item.artBuild || item.art)
            : b.state === 'gift'     ? (item.artGift  || item.art)
            : item.art;
  art.innerHTML = src ? `<img src="${src}" alt="" style="transform:scaleX(${b.flip ? -1 : 1})">` : '';

  if(b.state === 'building')  el.insertAdjacentHTML('beforeend', '<div class="chip">🕐 …</div>');
  else if(b.state === 'gift') el.insertAdjacentHTML('beforeend', '<div class="chip unlock">🔓</div>');
  else                        el.insertAdjacentHTML('beforeend', `<div class="label">${item.name}</div>`);
}
const paintAll = () => { PLOTS.forEach(paintPlot); coinsEl.textContent = coins.toLocaleString('ru'); };

/* ═══════════ ТАЙМЕР СТРОЙКИ ═══════════ */

setInterval(() => {
  const now = Date.now();
  Object.entries(built).forEach(([pid, b]) => {
    if(b.state !== 'building') return;
    const left = b.endsAt - now;
    if(left <= 0){
      b.state = 'gift';                 // достроилось — но сперва надо раскрыть
      paintPlot(PLOTS.find(p => p.id === pid));
      save();
    } else {
      const chip = plotEls[pid].querySelector('.chip');
      if(chip){
        const s = Math.ceil(left / 1000);
        chip.textContent = `🕐 ${Math.floor(s/60)} мин ${s%60} сек`;
      }
    }
  });
}, 100);

/* ═══════════ РЕЖИМ РАЗМЕЩЕНИЯ ═══════════ */

let placing = null;    // { itemId, plotId, flip }

function startPlacing(itemId){
  const item = itemById(itemId);
  if(coins < item.price) return say('Не хватает монет');
  closeSheet();
  placing = { itemId, plotId: PLOTS.find(p => !built[p.id])?.id, flip:false };
  if(!placing.plotId){ placing = null; return say('Свободных мест нет'); }
  document.body.classList.add('placing');
  renderPlacing();
  scFire('placing');
}

function renderPlacing(){
  const item = itemById(placing.itemId);
  PLOTS.forEach(p => {
    const el = plotEls[p.id];
    el.classList.toggle('pick', p.id === placing.plotId);
    if(built[p.id]) return;
    el.querySelector('.art').innerHTML = p.id === placing.plotId
      ? `<img src="${item.art}" alt="" style="opacity:.85;transform:scaleX(${placing.flip ? -1 : 1})">`
      : '';
  });
  dock.innerHTML =
    `<button class="square" id="cancel">✕</button>
     <button class="primary" id="confirm">Построить за ${item.price.toLocaleString('ru')}</button>
     <button class="square" id="flip">↻</button>`;
  say('Выбери место на карте');
}

function stopPlacing(){
  placing = null;
  document.body.classList.remove('placing');
  dock.innerHTML = '<button class="primary" id="openSheet">🔨 Постройки</button>';
  paintAll();
}

const dock = document.getElementById('dock');
dock.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  if(b.id === 'openSheet') return openSheet();
  if(b.id === 'cancel')    return stopPlacing();
  if(b.id === 'flip'){ placing.flip = !placing.flip; return renderPlacing(); }
  if(b.id === 'confirm'){
    const item = itemById(placing.itemId);
    coins -= item.price;
    built[placing.plotId] = { itemId:item.id, state:'building', endsAt:Date.now()+BUILD_MS, flip:placing.flip };
    stopPlacing();
    save();
    say(`${item.name} строится`);
  }
});

/* ═══════════ ТАПЫ ПО КАРТЕ ═══════════ */

canvas.addEventListener('click', e => {
  const wasPanned = panned; panned = false;
  if(wasPanned) return;

  const el = e.target.closest('.plot');
  if(!el) return;
  const pid = el.dataset.id;

  if(placing){                            // выбираем плитку под здание
    if(!built[pid]){ placing.plotId = pid; renderPlacing(); }
    return;
  }

  const b = built[pid];
  if(!b) return say('Строить можно через кнопку «Постройки»');
  if(b.state === 'building') return say('Ещё строится');
  if(b.state === 'gift')     return unwrap(pid);
  const item = itemById(b.itemId);
  if(item.opens === 'generator') return openGenerator();
  say(`${item.name}: экран пока не сделан`);
});

/* раскрываем подарок → конфетти → здание готово */
function unwrap(pid){
  built[pid].state = 'ready';
  paintPlot(PLOTS.find(p => p.id === pid));
  save();
  confetti();
  scFire('built');
  say(`${itemById(built[pid].itemId).name} построен`);
}

function confetti(){
  const box = document.getElementById('confetti');
  const colors = ['#ffd60a','#ff453a','#0a84ff','#30d158','#ff9f0a','#bf5af2'];
  box.innerHTML = '';
  for(let i = 0; i < 40; i++){
    const s = document.createElement('span');
    s.style.left = (10 + Math.random()*80) + 'vw';
    s.style.top = (10 + Math.random()*25) + 'vh';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', (Math.random()*160 - 80) + 'px');
    s.style.animationDelay = (Math.random()*.35) + 's';
    box.appendChild(s);
  }
  box.classList.add('on');
  setTimeout(() => box.classList.remove('on'), 2200);
}

/* ═══════════ КАТАЛОГ ═══════════ */

const sheet = document.getElementById('sheet');
function openSheet(){
  scFire('sheetOpened');
  const cats = document.getElementById('cats');
  cats.innerHTML = CATALOG.map(c => `
    <div class="cat">
      <span class="dot"></span>
      <b>${c.cat}</b>
      <div class="row">
        ${c.items.filter(i => !i.hidden).map(i => `
          <div class="card ${i.locked ? 'locked' : ''}">
            <img src="${i.art}" alt="">
            <b>${i.name}</b>
            <button class="buy" data-item="${i.id}" ${i.locked ? 'disabled' : ''}>
              ${i.locked ? '🔒 закрыто' : i.price.toLocaleString('ru') + ' 🪙'}
            </button>
          </div>`).join('')}
      </div>
    </div>`).join('');
  sheet.classList.add('on');
}
const closeSheet = () => sheet.classList.remove('on');
sheet.addEventListener('click', e => {
  if(e.target.closest('.close')) return closeSheet();
  const buy = e.target.closest('[data-item]');
  if(buy) startPlacing(buy.dataset.item);
});

/* ═══════════ ПОДСКАЗКА ═══════════ */

let sayTimer;
function say(text){
  hintline.textContent = text;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => { hintline.textContent = ''; }, 2400);
}

/* ═══════════ ПЕРЕТАСКИВАНИЕ КАРТЫ ═══════════ */

const viewport = document.getElementById('viewport');
const MAP_W = 922, MAP_H = 1200;
let scale = 1, ox = 0, oy = 0, drag = null, panned = false;

function apply(){
  const w = MAP_W*scale, h = MAP_H*scale;
  ox = w <= innerWidth  ? (innerWidth  - w)/2 : Math.min(0, Math.max(innerWidth  - w, ox));
  oy = h <= innerHeight ? (innerHeight - h)/2 : Math.min(0, Math.max(innerHeight - h, oy));
  canvas.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`;
}
function fit(){
  scale = Math.max(innerWidth/MAP_W, innerHeight/MAP_H);
  ox = (innerWidth - MAP_W*scale)/2;
  oy = (innerHeight - MAP_H*scale)/2;
  apply();
}
addEventListener('resize', fit);

viewport.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, ox, oy}; panned = false; });
addEventListener('pointermove', e => {
  if(!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(Math.hypot(dx, dy) > 6) panned = true;
  ox = drag.ox + dx; oy = drag.oy + dy;
  apply();
});
addEventListener('pointerup',     () => { drag = null; });
addEventListener('pointercancel', () => { drag = null; });

/* ═══════════ ЭКРАН ЗДАНИЯ ═══════════ */

const screen = document.getElementById('screen');

// генератор создаётся сразу: онбординг подписывается на его события
const gen0 = createGenerator(document.getElementById('app'), {
  assets:'../assets', storeKey:'farm-onb-generator',
  mode:'single', cells:5, unlocked:['coffee'], chrome:false, dim:true
});
gen0.reset();
const gen = gen0;

function openGenerator(){
  screen.classList.add('on');
  dispatchEvent(new Event('resize'));
  scFire('generatorOpened');
}
screen.querySelector('.back').addEventListener('click', () => screen.classList.remove('on'));

document.getElementById('reset').addEventListener('click', () => {
  coins = 5000; built = {}; save(); stopPlacing(); paintAll(); say('Карта сброшена');
});



/* ═══════════════════════════════════════════════════════════════
   ОНБОРДИНГ: сплошной сценарий от первого захода до кофейни.

   Живёт на карте, потому что здесь уже есть и постройка, и вход
   в генератор — иначе флоу разорвался бы между страницами.

   Шаг описывает: кто говорит, что говорит, куда смотрит камера,
   на что показывает стрелка и чего ждём от человека.
   ═══════════════════════════════════════════════════════════════ */

const story    = document.getElementById('story');
const storyImg = story.querySelector('.who img');
const storyName= story.querySelector('.name');
const storyText= story.querySelector('.text');
const point    = document.getElementById('point');

const CAST = {
  grandson: { name:'Внучара', img:'../assets/onboarding/Maloy.png',  cls:'grandson' },
  granny:   { name:'Бабуся',  img:'../assets/onboarding/Granny.png', cls:'granny' },
};

const SCRIPT = [
  { who:'grandson', text:'Приехал с города, а в деревне минус вайб — нет моей любимой латте на безлактозном молоке' },
  { who:'granny',   text:'А ты че думал, шегол? В деревне не все так просто, тут нужно со знанием дела, по совести, без суеты бэм бэм…' },
  { who:'grandson', text:'Очень хочется кофе, кажется бабуся говорила нужно начать с кофейных зерен? Как их там делать то?' },

  // камера подъезжает к генератору, над ним стрелка
  { who:'grandson', text:'Дядь Вася хочет кофейное зерно, давай разберемся как достать зерно',
    focus:'generator', pointAt:'.plot[data-id="p0"]', wait:'generatorOpened' },

  // ── внутри генератора ──
  { gen:'seed' },
  { gen:'boost' },
  { gen:'level' },

  // ── обратно на карту ──
  { who:'granny', text:'Давно была в деревне кофейня но мы чет забросили ее давай восстановим посмотрим что там',
    focus:'oldman' },
  { who:'grandson', text:'Нам нужна кофейня давай строить',
    pointAt:'#openSheet', wait:'sheetOpened' },
  { pointAt:'[data-item="coffee"]', wait:'placing' },
  { text:'Выбери место и подтверди', wait:'built' },
  { who:'grandson', text:'СКОРЕЕ сделаем кофе я хочу латте на безлактозном' },
];

let sc = -1, scWait = null;

function scNext(){
  sc++;
  point.classList.remove('on');
  if(sc >= SCRIPT.length){ story.classList.remove('on'); scWait = null; return; }
  const st = SCRIPT[sc];

  if(st.gen){ story.classList.remove('on'); return genStep(st.gen); }

  if(st.who){
    const c = CAST[st.who];
    storyImg.src = c.img;
    storyName.textContent = c.name;
    storyName.className = 'name ' + c.cls;
    story.querySelector('.who').style.display = '';
  } else {
    story.querySelector('.who').style.display = 'none';
  }
  storyText.textContent = st.text || '';
  story.classList.add('on');

  if(st.focus) focusOn(st.focus);
  if(st.pointAt) setTimeout(() => pointTo(st.pointAt), st.focus ? 700 : 60);

  scWait = st.wait || null;
  story.querySelector('.next').style.display = scWait ? 'none' : '';
}

/* по тапу листаем только те шаги, которые ничего не ждут */
story.addEventListener('click', () => { if(!scWait) scNext(); });

/* ─── камера ─── */

function focusOn(what){
  const target = what === 'generator' ? {x:285, y:880} : {x:470, y:660};
  const z = 1.35;
  const from = {s:scale, x:ox, y:oy};
  const to = { s:z, x: innerWidth/2 - target.x*z, y: innerHeight/2 - target.y*z };
  const t0 = performance.now();
  (function tick(now){
    const k = Math.min(1, (now - t0)/650);
    const e = 1 - Math.pow(1 - k, 3);
    scale = from.s + (to.s - from.s)*e;
    ox = from.x + (to.x - from.x)*e;
    oy = from.y + (to.y - from.y)*e;
    apply();
    if(k < 1) requestAnimationFrame(tick);
  })(t0);
}

/* ─── стрелка на элемент ─── */

function pointTo(sel){
  const el = document.querySelector(sel);
  if(!el) return;
  const r = el.getBoundingClientRect();
  point.style.left = (r.left + r.width/2 - 22) + 'px';
  point.style.top  = Math.max(60, r.top - 58) + 'px';
  point.classList.add('on');
}

/* ─── сценарий внутри генератора ─── */

function genStep(kind){
  if(kind === 'seed'){
    genBubble('Давай посадим наши первые кофейные зерна', true);
    genWait = 'allSeeded';
  } else if(kind === 'boost'){
    genBubble('Жаль невозможно вернуть 2007 год нажатием кнопки', false);
    showBoostTip();
    genWait = 'boosted';
  } else if(kind === 'level'){
    showLevel();
  }
}

/* ─── что ждём ─── */

function scFire(ev){
  if(scWait === ev){ scWait = null; scNext(); }
}


/* ═══ подсказки внутри генератора ═══
   Пунктир и стрелки из статичного макета не рисуем: движущегося
   зерна с рукой достаточно, путь читается по самому движению. */

const genSpeech = document.getElementById('genSpeech');
const genDemo   = document.getElementById('genDemo');
const boostTip  = document.getElementById('boostTip');
const levelBox  = document.getElementById('level');
let genWait = null;

function genBubble(text, withDemo){
  genSpeech.querySelector('img').src = '../assets/onboarding/avatar maloy-mini.png';
  genSpeech.querySelector('.b').textContent = text;
  const grid = document.querySelector('#app .block');
  if(grid) genSpeech.style.top = Math.max(96, grid.getBoundingClientRect().top - 130) + 'px';
  genSpeech.classList.add('on');
  if(withDemo) drawGenDemo(); else genDemo.classList.remove('on');
}
function hideGenHint(){ genSpeech.classList.remove('on'); genDemo.classList.remove('on'); }

/* зерно едет от лотка через весь ряд — путь невидимый, виден только жест */
function drawGenDemo(){
  const cells = [...document.querySelectorAll('#app .cell')];
  const src = document.querySelector('#app .seed:not(.locked)');
  if(!src || !cells.length) return;
  const rs = src.getBoundingClientRect();
  const f = cells[0].getBoundingClientRect();
  const l = cells[cells.length-1].getBoundingClientRect();
  const x0 = rs.left + rs.width/2, y0 = rs.top + rs.height/2;
  const y = f.top + f.height/2;
  const x1 = f.left + f.width/2, x2 = l.left + l.width/2;
  const d = `M ${x0} ${y0} C ${x0-60} ${y0-120}, ${x1-60} ${y+120}, ${x1} ${y} L ${x2} ${y}`;
  genDemo.innerHTML = `<div class="runner" style="offset-path:path('${d}')">
      <img src="../assets/imgcoffe.png" alt=""></div>`;
  genDemo.classList.add('on');
}

/* подсказка уходит, только когда реально взяли зерно из лотка */
document.getElementById('app').addEventListener('pointerdown', e => {
  if(genWait && e.target.closest('.seed:not(.locked)')) hideGenHint();
});

function showBoostTip(){
  const cells = [...document.querySelectorAll('#app .cell')];
  const mid = cells[Math.floor(cells.length/2)];
  if(!mid) return;
  const r = mid.getBoundingClientRect();
  boostTip.style.left = (r.left + r.width/2) + 'px';
  boostTip.style.top  = (r.bottom + 14) + 'px';
  boostTip.classList.add('on');
}

boostTip.querySelector('.boost').addEventListener('click', () => {
  boostTip.classList.remove('on');
  hideGenHint();
  flyAwayBeans();
  const cells = [...document.querySelectorAll('#app .cell')];
  gen.setCells(cells.map((_, i) => ({ index:i, state:'empty' })));
  genWait = null;
  setTimeout(scNext, 800);
});

/* зёрна улетают вверх-вправо за экран, а не просто исчезают */
function flyAwayBeans(){
  // берём координаты ячейки, а не картинки внутри: у неё размер может быть нулевым
  document.querySelectorAll('#app .cell').forEach((cell, i) => {
    const img = cell.querySelector('img');
    if(!img || img.hidden) return;
    const r = cell.getBoundingClientRect();
    if(!r.width) return;
    const fly = document.createElement('img');
    fly.src = img.src;
    fly.className = 'flyaway';
    fly.style.left = (r.left + r.width/2 - 22) + 'px';
    fly.style.top  = (r.top + r.height/2 - 22) + 'px';
    fly.style.animationDelay = (i * 55) + 'ms';
    document.body.appendChild(fly);
    setTimeout(() => fly.remove(), 1400);
  });
}

function showLevel(){ hideGenHint(); levelBox.classList.add('on'); }

// забрал награду — генератор закрывается сам, дальше сюжет на карте
levelBox.querySelector('.take').addEventListener('click', () => {
  levelBox.classList.remove('on');
  screen.classList.remove('on');
  scNext();
});

/* засеял весь ряд — сразу тултип ускорения, ждать не заставляем */
gen0.on('change', st => {
  if(genWait === 'allSeeded' && st.empty === 0){ genWait = null; scNext(); }
});

buildPlots();
fit();
scNext();
</script>
