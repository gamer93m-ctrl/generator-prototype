<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Онбординг — прототип</title>
<link rel="stylesheet" href="../shared/generator/generator.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    font:400 15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff}
  button{font:inherit;cursor:pointer}

  /* ─── реплика персонажа ─── */
  #speech{position:fixed;left:16px;right:16px;z-index:70;
    display:flex;align-items:flex-start;gap:12px;pointer-events:none;
    opacity:0;transform:translateY(-6px);transition:opacity .22s,transform .22s}
  #speech.on{opacity:1;transform:none}
  /* обводка уже нарисована в самой картинке — своей рамки не добавляем */
  #speech .who{flex:0 0 auto;width:66px;height:66px}
  #speech .who img{width:100%;height:100%;object-fit:contain;display:block}
  #speech .bubble{background:#3a3a3c;border-radius:18px;padding:14px 16px;
    font-size:16px;line-height:1.3;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.5)}

  /* ─── демонстрация жеста ─── */
  #demo{position:fixed;inset:0;z-index:69;pointer-events:none;display:none}
  #demo.on{display:block}
  #demo path{stroke:#ffd60a;stroke-width:5;stroke-dasharray:12 10;stroke-linecap:round;fill:none}
  #demo polygon{fill:#ffd60a}
  /* зерно едет по тому же пути, что нарисован пунктиром */
  #demo .runner{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;
    offset-rotate:0deg;animation:ride 3.4s cubic-bezier(.5,0,.5,1) infinite}
  #demo .runner img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
  #demo .runner .hand{position:absolute;right:-14px;bottom:-18px;font-size:34px}
  @keyframes ride{
    0%   {offset-distance:0%;   opacity:0;transform:scale(.75)}
    8%   {opacity:1;transform:scale(1)}
    88%  {offset-distance:100%; opacity:1;transform:scale(1)}
    100% {offset-distance:100%; opacity:0;transform:scale(.75)}
  }

  /* ─── экран уровня ─── */
  #level{position:fixed;inset:0;z-index:80;background:#000;display:none;
    flex-direction:column;align-items:center;padding:64px 20px 34px}
  #level.on{display:flex}
  #level .num{width:96px;height:96px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center;
    font-size:40px;font-weight:700;margin-top:70px}
  #level h2{margin:24px 0 0;font-size:30px;font-weight:700}
  #level .reward{margin-top:10px;color:#8e8e93;font-size:15px;display:flex;align-items:center;gap:8px}
  #level .reward b{background:rgba(255,255,255,.12);border-radius:100px;padding:6px 12px;color:#fff;font-size:14px}
  #level .got{margin-top:44px;color:#8e8e93;font-size:14px}
  #level .items{display:flex;gap:12px;margin-top:12px}
  #level .items div{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.1);
    display:grid;place-items:center;font-size:30px}
  #level .take{margin-top:auto;width:100%;background:#ffd60a;color:#000;border:0;border-radius:14px;
    padding:17px;font:600 16px/1 inherit}

  /* ─── тултип ускорения ─── */
  #boostTip{position:fixed;z-index:71;display:none;transform:translate(-50%,0)}
  #boostTip.on{display:block}
  #boostTip .box{background:#428bf9;border-radius:16px;padding:12px 14px;min-width:150px;text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.5)}
  #boostTip .box b{display:block;font-size:16px;font-weight:700;margin-bottom:8px}
  #boostTip .time{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
    border-radius:100px;padding:5px 10px;font-size:13px;font-weight:500}
  #boostTip .boost{display:block;width:100%;margin-top:8px;background:#ffd60a;color:#000;border:0;
    border-radius:100px;padding:9px 12px;font:600 14px/1 inherit}
  #boostTip .nose{position:absolute;left:50%;top:-7px;transform:translateX(-50%) rotate(45deg);
    width:14px;height:14px;background:#428bf9;border-radius:3px}
  #boostTip .point{position:absolute;right:calc(100% + 10px);bottom:14px;font-size:30px;color:#ffd60a;
    animation:nudge .8s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}

  #dev{position:fixed;left:10px;bottom:8px;z-index:90;display:flex;gap:6px;opacity:.55}
  #dev button{border:1px dashed #48484a;background:rgba(28,28,30,.9);color:#8e8e93;
    border-radius:100px;padding:6px 10px;font:600 11px/1 inherit}
</style>
</head>
<body>

<div id="app"></div>

<div id="speech"><div class="who"><img src="../assets/onboarding/avatar maloy-mini.png" alt=""></div><div class="bubble"></div></div>
<div id="demo"></div>

<div id="boostTip">
  <div class="box">
    <span class="nose"></span>
    <b id="tipName">Кофе</b>
    <span class="time">🕐 <span id="tipTime">ещё 29 сек</span></span>
    <button class="boost">🪙 Бесплатно</button>
    <span class="point">➡</span>
  </div>
</div>

<div id="level">
  <div class="num">2</div>
  <h2>Новый уровень</h2>
  <div class="reward">Заберите награду: <b>🪙 93</b></div>
  <div class="got">Теперь вам доступны</div>
  <div class="items"><div>🌾</div><div>🍌</div></div>
  <button class="take">Забрать награду</button>
</div>

<div id="dev"><button id="again">сначала</button></div>

<script src="../shared/generator/generator.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   Онбординг.

   Подсказка и реплика живут одновременно и показываются сразу,
   без «нажми чтобы продолжить». Анимация показывает сам жест:
   рука берёт зерно из лотка и раскладывает по грядкам. Она
   крутится бесконечно, пока человек не начнёт делать сам.

   Тронул лоток — подсказка гаснет. Отпустил, ничего не засеяв —
   подсказка возвращается.
   ═══════════════════════════════════════════════════════════ */

const gen = createGenerator(document.getElementById('app'), {
  assets: '../assets',
  storeKey: 'onboarding-v2',
  mode: 'single',
  cells: 5,
  unlocked: ['coffee'],
  chrome: false,
  dim: true
});

gen.reset();   // сценарий всегда начинается с чистых грядок

const speech = document.getElementById('speech');
const bubble = speech.querySelector('.bubble');
const demo   = document.getElementById('demo');
const level  = document.getElementById('level');

const STEPS = [
  { say:'Давай посадим наши первые кофейные зерна',
    demo:'seed', done:'seeded' },

  // жест уже показан и повторён человеком — анимацию больше не крутим
  { say:'Отлично! Засей остальные грядки',
    done:'allSeeded' },

  // ускорение: тултип с «Бесплатно» и стрелка на кнопку
  { say:'Жаль невозможно вернуть 2007 год нажатием кнопки',
    tip:true, done:'boosted' },

  { level:true },
];

let step = -1, waitFor = null, demoKind = null;

function go(){
  step++;
  if(step >= STEPS.length) return finish();
  const s = STEPS[step];

  if(s.level){ hideHint(); level.classList.add('on'); return; }

  bubble.textContent = s.say;
  waitFor = s.done;
  demoKind = s.demo || null;
  showHint();
  if(s.tip) showTip();
}

/* ═══ ускорение ═══
   Тултип висит под грядками. По кнопке генерация схлопывается,
   и ресурс забирается сам — так решили: ускорил, значит забрал. */

const tip = document.getElementById('boostTip');

function showTip(){
  const cells = [...document.querySelectorAll('.cell')];
  const mid = cells[Math.floor(cells.length/2)];
  if(!mid) return;
  const r = mid.getBoundingClientRect();
  tip.style.left = (r.left + r.width/2) + 'px';
  tip.style.top  = (r.bottom + 14) + 'px';
  document.getElementById('tipName').textContent = 'Кофе';
  tip.classList.add('on');
}
const hideTip = () => tip.classList.remove('on');

/* живой отсчёт в тултипе */
setInterval(() => {
  if(!tip.classList.contains('on')) return;
  const st = gen.stats();
  document.getElementById('tipTime').textContent =
    st.growing ? 'ещё 29 сек' : 'готово';
}, 400);

tip.querySelector('.boost').addEventListener('click', () => {
  hideTip();
  boost();
});

function boost(){
  // генерация мгновенно доходит до конца
  const cells = [...document.querySelectorAll('.cell')];
  gen.setCells(cells.map((_, i) => ({ index:i, state:'ready', typeId:'coffee', endsAt:0 })));

  bubble.textContent = 'Забираем!';
  setTimeout(() => {
    // и сразу забирается само, со стрелкой на нужный ресурс
    flashTo(document.querySelector('.seed:not(.locked)'));
    gen.setCells(cells.map((_, i) => ({ index:i, state:'empty' })));
    setTimeout(() => { waitFor = null; hideHint(); go(); }, 900);
  }, 650);
}

/* короткая стрелка «ресурс уехал сюда» */
function flashTo(target){
  if(!target) return;
  const cells = [...document.querySelectorAll('.cell')];
  const from = cells[Math.floor(cells.length/2)].getBoundingClientRect();
  const to = target.getBoundingClientRect();
  const x1 = from.left + from.width/2, y1 = from.bottom;
  const x2 = to.left + to.width/2,     y2 = to.top - 8;
  demo.innerHTML = `<svg width="100%" height="100%" style="position:absolute;inset:0">
      <path d="M ${x1} ${y1} Q ${(x1+x2)/2 + 40} ${(y1+y2)/2} ${x2} ${y2}"/>
      <polygon points="${x2},${y2 + 13} ${x2 - 9},${y2 - 3} ${x2 + 9},${y2 - 3}"/>
    </svg>`;
  demo.classList.add('on');
  setTimeout(() => demo.classList.remove('on'), 1100);
}

/* ─── подсказка: реплика + анимация жеста ─── */

function showHint(){
  placeSpeech();
  speech.classList.add('on');
  if(demoKind) drawDemo(demoKind);
}
function hideHint(){
  speech.classList.remove('on');
  demo.classList.remove('on');
}

/* реплика встаёт в промежутке между подзаголовком и сеткой */
function placeSpeech(){
  const grid = document.querySelector('.block');
  const sub  = document.getElementById('desc');
  if(!grid) return;
  const gridTop = grid.getBoundingClientRect().top;
  const subBottom = sub ? sub.getBoundingClientRect().bottom : 120;
  const h = speech.offsetHeight || 76;
  speech.style.top = Math.max(subBottom + 20, gridTop - h - 40) + 'px';
}

/* путь жеста: от лотка вверх к первой грядке и дальше вдоль ряда */
function drawDemo(kind){
  const cells = [...document.querySelectorAll('.cell')];
  const src = kind === 'seed'
    ? document.querySelector('.seed:not(.locked)')
    : cells[0];
  if(!src || !cells.length) return;

  const rs = src.getBoundingClientRect();
  const first = cells[0].getBoundingClientRect();
  const last  = cells[cells.length - 1].getBoundingClientRect();

  const x0 = rs.left + rs.width/2, y0 = rs.top + rs.height/2;
  const yRow = first.bottom + 14;
  const x1 = first.left + first.width/2;
  const x2 = last.left + last.width/2;

  const d = kind === 'seed'
    ? `M ${x0} ${y0} C ${x0 - 40} ${y0 - 90}, ${x1 - 50} ${yRow + 70}, ${x1} ${yRow} L ${x2} ${yRow}`
    : `M ${x1} ${yRow} L ${x2} ${yRow}`;

  const bean = kind === 'seed' ? '../assets/imgcoffe.png' : null;

  demo.innerHTML = `
    <svg width="100%" height="100%" style="position:absolute;inset:0">
      <path d="${d}"/>
      <polygon points="${x1},${yRow - 14} ${x1 - 9},${yRow + 3} ${x1 + 9},${yRow + 3}"/>
      <polygon points="${x2 + 14},${yRow} ${x2 - 3},${yRow - 9} ${x2 - 3},${yRow + 9}"/>
    </svg>
    <div class="runner" style="offset-path:path('${d}')">
      ${bean ? `<img src="${bean}" alt="">` : ''}
      <span class="hand">👆</span>
    </div>`;
  demo.classList.add('on');
}

/* ─── реакция на действия человека ─── */

const app = document.getElementById('app');

// подсказка уходит, только когда человек реально взял ресурс из лотка;
// от обычного тапа по экрану она не должна пропадать
app.addEventListener('pointerdown', e => {
  if(!waitFor) return;
  if(!e.target.closest('.seed:not(.locked)')) return;
  hideHint();
  clearTimeout(backTimer);
});

// отпустил и ничего не изменилось — подсказка возвращается
let backTimer;
addEventListener('pointerup', () => {
  if(!waitFor) return;
  clearTimeout(backTimer);
  backTimer = setTimeout(() => { if(waitFor) showHint(); }, 700);
});

let seen = gen.stats();
gen.on('change', st => {
  const before = seen; seen = st;
  clearTimeout(backTimer);

  if(waitFor === 'seeded'    && st.growing > before.growing) return next();
  if(waitFor === 'collected' && st.empty   > before.empty)   return next();
  if(waitFor === 'allSeeded' && st.empty === 0)              return next();

  // человек уже что-то сделал — подсказку не навязываем, пусть доделывает сам
});

setInterval(() => {
  if(waitFor === 'ready' && gen.stats().ready > 0) next();
}, 200);

function next(){
  waitFor = null;
  hideHint();
  setTimeout(go, 450);       // пауза, чтобы человек увидел результат
}

function finish(){ waitFor = null; hideHint(); }

/* ─── экран уровня ─── */
// забрал награду — и сразу оказываешься на карте, генератор закрывается сам
level.querySelector('.take').addEventListener('click', () => {
  location.href = '../map/';
});

document.getElementById('again').addEventListener('click', () => {
  gen.reset(); seen = gen.stats();
  step = -1; waitFor = null;
  level.classList.remove('on');
  go();
});

addEventListener('resize', () => { if(waitFor){ placeSpeech(); if(demoKind) drawDemo(demoKind); } });

go();
</script>
</body>
</html>
